services:
  - type: web
    name: observable-incident-triage-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v2/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /tmp/incident_agent_v2.sqlite3
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
